<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Fetcher</title>
    <script src="asyncpokemon.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #ffcb05;
            color: #3b4cca;
            border: 2px solid #3b4cca;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #3b4cca;
            color: #ffcb05;
        }
        #pokemon-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .pokemon-card {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            margin: 10px;
            width: 120px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .pokemon-number {
            font-size: 12px;
            color: #666;
        }
        .pokemon-name {
            font-weight: bold;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

<button id="get-pokemon-btn">get pokemon</button>
<div id="pokemon-container"></div>


</body>
</html>
