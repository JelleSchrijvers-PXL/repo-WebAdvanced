<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maanmissies Database</title>
  <script src="moonflight.js" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b1d3a;
      color: #ffffff;
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #4fc3f7;
      margin-bottom: 30px;
    }
    .controls {
      background-color: #152b52;
      padding: 20px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    button, select {
      padding: 10px 15px;
      font-size: 15px;
      margin: 5px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    button {
      background-color: #4fc3f7;
      color: #0b1d3a;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #81d4fa;
    }
    select {
      background-color: #ffffff;
      color: #333333;
      font-weight: bold;
    }
    #result-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .mission-card {
      background-color: #1e3a67;
      border-left: 5px solid #4fc3f7;
      border-radius: 6px;
      padding: 20px;
      width: 280px;
      text-align: left;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .mission-card h3 {
      margin-top: 0;
      color: #4fc3f7;
    }
    .mission-year {
      font-size: 14px;
      color: #b0bec5;
      margin-bottom: 10px;
    }
    .astronauts-list {
      margin: 10px 0 0 0;
      padding-left: 20px;
      font-size: 14px;
      color: #e0e0e0;
    }
    .status-message {
      font-style: italic;
      color: #b0bec5;
    }
  </style>
</head>
<body>

<h1>🚀 Maanmissies Verkenner</h1>

<div class="controls">
  <button id="get-all-btn">Alle data ophalen</button>

  |

  <label for="mission-select">Kies ID:</label>
  <select id="mission-select">
  </select>

  <button id="get-single-btn">GetData</button>
</div>

<div id="result-container">
  <p class="status-message">Klik op een knop om data te laden...</p>
</div>


</body>
</html>
